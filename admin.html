<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B2128">
<title>POLISH N MANI | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
:root{--bg:#1B2128;--panel:#fff;--ink:#1B2128;--orange:#FF9C3B;--muted:#68717a;--line:#e8e8e8}
*{box-sizing:border-box}
body{margin:0;min-width:320px;background:var(--bg);color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:25px 14px 16px}
.logo{width:100px;height:100px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 8px}
.subtitle{color:var(--orange);letter-spacing:4px;font-size:11px;font-weight:bold}
.wrap{max-width:1100px;margin:auto;padding:12px 16px 40px}
.card{background:var(--panel);color:var(--ink);border-radius:16px;padding:22px;box-shadow:0 10px 35px #0002}
h1{font-size:22px;margin:0 0 6px}
h2{font-size:18px;margin:0}
.muted{color:var(--muted);font-size:13px}
label{display:block;font-weight:bold;font-size:13px;margin:14px 0 6px}
input{width:100%;padding:13px;border:1px solid #d8d8d8;border-radius:8px;font-size:16px}
button{border:0;border-radius:8px;padding:12px 15px;font-weight:bold;cursor:pointer;font-size:13px}
button:disabled{opacity:.55;cursor:wait}
.primary{background:var(--orange);color:var(--ink)}
.secondary{background:#eceff1;color:var(--ink)}
.danger{background:#fde8e7;color:#9e2520}
.success{background:#e2f5e9;color:#176b37}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.notice{display:none;margin:12px 0;padding:12px;border-radius:8px;background:#fff4d9;color:#79501d;font-size:13px}
.hidden{display:none!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{background:#f5f5f5;border-radius:10px;padding:13px}
.stat strong{display:block;font-size:23px;margin-top:4px}
.booking{border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:12px}
.booking-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.booking h3{margin:0 0 7px;font-size:16px}
.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:13px 0;font-size:13px}
.detail{background:#f7f7f7;padding:9px;border-radius:7px;overflow-wrap:anywhere}
.detail b{display:block;color:#68717a;font-size:11px;margin-bottom:4px}
.status{display:inline-block;padding:6px 9px;border-radius:20px;font-size:11px;font-weight:bold;background:#fff1d9;color:#87500b}
.status.confirmed{background:#e2f5e9;color:#176b37}
.status.rejected{background:#fde8e7;color:#9e2520}
.booking-buttons{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;padding:30px;color:var(--muted)}
.section-title{margin:25px 0 8px}
@media(max-width:600px){header{padding-top:18px}.logo{width:86px;height:86px}.wrap{padding:8px 10px 28px}.card{padding:15px}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:20px}.details{grid-template-columns:1fr}.booking-buttons button{flex:1}.topbar h1{font-size:20px}}
</style>
</head>
<body>
<header>
  <img src="logo.jpg" class="logo" alt="Polish N Mani">
  <div class="subtitle">ADMIN PANEL</div>
</header>

<main class="wrap">
  <section class="card" id="loginCard">
    <h1>Logowanie właściciela</h1>
    <p class="muted">Zaloguj się danymi konta utworzonego w Supabase.</p>
    <form id="loginForm">
      <label for="email">Adres e-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Hasło</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" id="loginButton" type="submit" style="width:100%;margin-top:16px">ZALOGUJ SIĘ</button>
    </form>
    <div class="notice" id="loginNotice"></div>
  </section>

  <section class="card hidden" id="dashboard">
    <div class="topbar">
      <div><h1>Rezerwacje</h1><div class="muted" id="signedInAs"></div></div>
      <div class="actions">
        <button class="primary" id="enablePushButton" type="button">WŁĄCZ POWIADOMIENIA</button>
        <button class="secondary" id="refreshButton">ODŚWIEŻ</button>
        <button class="danger" id="logoutButton">WYLOGUJ</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="muted">Oczekujące</span><strong id="pendingCount">0</strong></div>
      <div class="stat"><span class="muted">Potwierdzone</span><strong id="confirmedCount">0</strong></div>
      <div class="stat"><span class="muted">Odrzucone</span><strong id="rejectedCount">0</strong></div>
    </div>
    <div class="notice" id="dashboardNotice"></div>
    <h2 class="section-title">Wszystkie zgłoszenia</h2>
    <div id="bookingList"><div class="empty">Ładowanie rezerwacji...</div></div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://zixdxcetovwtcmknnafm.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_FK_I3Inup6XZyjvL5TWDPw_SJVMsQ7K";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const ONESIGNAL_APP_ID = "19af32ef-faa2-47fe-a740-3abb09527f3c";
window.OneSignalDeferred = window.OneSignalDeferred || [];
const oneSignalReady = new Promise((resolve, reject) => {
  window.OneSignalDeferred.push(async function (OneSignal) {
    try {
      await OneSignal.init({
        appId: ONESIGNAL_APP_ID,
        serviceWorkerPath: "/polish-n-mani/OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/polish-n-mani/" }
      });
      resolve(OneSignal);
    } catch (error) {
      console.error("OneSignal init error:", error);
      reject(error);
    }
  });
});

const loginCard = document.getElementById("loginCard");
const dashboard = document.getElementById("dashboard");
const loginNotice = document.getElementById("loginNotice");
const dashboardNotice = document.getElementById("dashboardNotice");
const bookingList = document.getElementById("bookingList");

function showNotice(element, message) {
  element.textContent = message;
  element.style.display = "block";
}
function hideNotice(element) { element.style.display = "none"; }
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[char]));
}
function formatDate(value) {
  if (!value) return "—";
  const parts = value.split("-");
  if (parts.length !== 3) return value;
  return `${parts[2]}.${parts[1]}.${parts[0]}`;
}
function statusLabel(status) {
  if (status === "confirmed") return "POTWIERDZONA";
  if (status === "rejected") return "ODRZUCONA";
  return "OCZEKUJE";
}
function statusClass(status) {
  if (status === "confirmed") return "confirmed";
  if (status === "rejected") return "rejected";
  return "";
}
function showDashboard(user) {
  loginCard.classList.add("hidden");
  dashboard.classList.remove("hidden");
  document.getElementById("signedInAs").textContent = user.email || "Zalogowano";
}
function showLogin() {
  dashboard.classList.add("hidden");
  loginCard.classList.remove("hidden");
}
async function loadBookings() {
  hideNotice(dashboardNotice);
  bookingList.innerHTML = '<div class="empty">Ładowanie rezerwacji...</div>';

  const { data, error } = await db
    .from("bookings")
    .select("id,created_at,appointment_date,appointment_time,client_name,phone,service_description,status,price,owner_note")
    .order("appointment_date", { ascending: true })
    .order("appointment_time", { ascending: true });

  if (error) {
    console.error("Load bookings error:", error);
    bookingList.innerHTML = "";
    showNotice(dashboardNotice, "Nie udało się pobrać rezerwacji. Sprawdź połączenie i politykę SELECT w Supabase.");
    return;
  }

  const rows = data || [];
  document.getElementById("pendingCount").textContent = rows.filter(x => x.status === "pending").length;
  document.getElementById("confirmedCount").textContent = rows.filter(x => x.status === "confirmed").length;
  document.getElementById("rejectedCount").textContent = rows.filter(x => x.status === "rejected").length;

  if (!rows.length) {
    bookingList.innerHTML = '<div class="empty">Brak zgłoszeń do wyświetlenia.</div>';
    return;
  }

  bookingList.innerHTML = rows.map(row => {
    const status = row.status || "pending";
    const pending = status === "pending";
    return `
      <article class="booking">
        <div class="booking-head">
          <div>
            <h3>${escapeHtml(row.client_name || "Klientka")}</h3>
            <span class="status ${statusClass(status)}">${statusLabel(status)}</span>
          </div>
          <strong>${formatDate(row.appointment_date)} • ${escapeHtml(row.appointment_time || "—")}</strong>
        </div>
        <div class="details">
          <div class="detail"><b>TELEFON</b>${escapeHtml(row.phone || "—")}</div>
          <div class="detail"><b>USŁUGA</b>${escapeHtml(row.service_description || "—")}</div>
          <div class="detail"><b>CENA</b>${row.price == null ? "Nieustalona" : escapeHtml(row.price)}</div>
          <div class="detail"><b>NOTATKA</b>${escapeHtml(row.owner_note || "—")}</div>
        </div>
        <div class="booking-buttons">
          ${pending ? `
            <button class="success" data-action="confirm" data-id="${escapeHtml(row.id)}">POTWIERDŹ</button>
            <button class="danger" data-action="reject" data-id="${escapeHtml(row.id)}">ODRZUĆ</button>
          ` : ""}
          <button class="secondary" data-action="delete" data-id="${escapeHtml(row.id)}">USUŃ</button>
        </div>
      </article>`;
  }).join("");
}

async function updateStatus(id, status) {
  const label = status === "confirmed" ? "potwierdzić" : "odrzucić";
  if (!confirm(`Czy na pewno chcesz ${label} tę rezerwację?`)) return;

  const { error } = await db.from("bookings").update({ status }).eq("id", id);
  if (error) {
    console.error("Update status error:", error);
    showNotice(dashboardNotice, "Nie udało się zmienić statusu. Sprawdź politykę UPDATE w Supabase.");
    return;
  }
  showNotice(dashboardNotice, status === "confirmed" ? "Rezerwacja została potwierdzona." : "Zgłoszenie zostało odrzucone.");
  await loadBookings();
}

async function deleteBooking(id) {
  if (!confirm("Czy na pewno chcesz trwale usunąć to zgłoszenie? Tej operacji nie można cofnąć.")) return;
  const { error } = await db.from("bookings").delete().eq("id", id);
  if (error) {
    console.error("Delete booking error:", error);
    showNotice(dashboardNotice, "Nie udało się usunąć zgłoszenia. Sprawdź politykę DELETE w Supabase.");
    return;
  }
  showNotice(dashboardNotice, "Zgłoszenie zostało usunięte.");
  await loadBookings();
}

document.getElementById("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  hideNotice(loginNotice);
  const button = document.getElementById("loginButton");
  button.disabled = true;
  button.textContent = "LOGOWANIE...";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const { data, error } = await db.auth.signInWithPassword({ email, password });
  button.disabled = false;
  button.textContent = "ZALOGUJ SIĘ";

  if (error) {
    console.error("Login error:", error);
    showNotice(loginNotice, "Logowanie nie powiodło się. Sprawdź adres e-mail i hasło.");
    return;
  }
  showDashboard(data.user);
  await loadBookings();
});

document.getElementById("logoutButton").addEventListener("click", async () => {
  await db.auth.signOut();
  showLogin();
});
document.getElementById("refreshButton").addEventListener("click", loadBookings);

async function enableOwnerPushNotifications() {
  const button = document.getElementById("enablePushButton");
  hideNotice(dashboardNotice);
  button.disabled = true;
  button.textContent = "WŁĄCZANIE...";
  try {
    const { data: { session } } = await db.auth.getSession();
    if (!session?.user) {
      throw new Error("Najpierw zaloguj się do panelu administratora.");
    }

    const OneSignal = await oneSignalReady;
    await OneSignal.Notifications.requestPermission();

    if (Notification.permission !== "granted") {
      throw new Error("Nie udzielono zgody na powiadomienia. Zmień uprawnienia powiadomień dla tej aplikacji w ustawieniach iPhone'a.");
    }

    await OneSignal.User.PushSubscription.optIn();
    await OneSignal.login("salon_owner");

    button.textContent = "POWIADOMIENIA WŁĄCZONE";
    showNotice(dashboardNotice, "Powiadomienia zostały włączone na tym urządzeniu i przypisane do telefonu właścicielki salonu.");
  } catch (error) {
    console.error("Enable owner push error:", error);
    button.textContent = "SPRÓBUJ PONOWNIE";
    showNotice(dashboardNotice, error?.message || "Nie udało się włączyć powiadomień. Sprawdź zgodę na powiadomienia i spróbuj ponownie.");
  } finally {
    button.disabled = false;
  }
}

document.getElementById("enablePushButton").addEventListener("click", enableOwnerPushNotifications);

bookingList.addEventListener("click", async event => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;
  const { action, id } = button.dataset;
  button.disabled = true;
  if (action === "confirm") await updateStatus(id, "confirmed");
  if (action === "reject") await updateStatus(id, "rejected");
  if (action === "delete") await deleteBooking(id);
  button.disabled = false;
});

(async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (session?.user) {
    showDashboard(session.user);
    await loadBookings();
  }
})();
</script>
</body>
</html>
